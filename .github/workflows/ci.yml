name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests + dbt build on a synthetic warehouse (no real data in the repo)
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: pytest -q
